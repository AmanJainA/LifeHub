<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>LifeHub</title></head>
<body>
<script>
(function () {
  var base = '/LifeHub/';
  var l = window.location;
  var path = l.pathname.indexOf(base) === 0 ? l.pathname.slice(base.length) : l.pathname.replace(/^\//, '');
  var search = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
  var hash = l.hash || '';
  var target = base + '?/' + path.replace(/&/g, '~and~') + search + hash;
  l.replace(l.protocol + '//' + l.host + target);
})();
</script>
</body>
</html>
